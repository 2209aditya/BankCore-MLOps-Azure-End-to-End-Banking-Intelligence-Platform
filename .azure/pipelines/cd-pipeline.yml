trigger: none

parameters:

- name: environment
  type: string
  default: dev
  values:
    - dev
    - qa
    - prod

pool:
  vmImage: ubuntu-latest

steps:

- task: UsePythonVersion@0
  inputs:
    versionSpec: "3.11"

- script: |
    pip install -r requirements.txt
  displayName: Install dependencies

- script: |
    python -m src.pipelines.fraud_training_pipeline \
      --input data/fraud.csv \
      --output-dir models/fraud
  displayName: Train fraud model

- script: |
    python src/models/fraud/evaluate.py \
      --model models/fraud/model.joblib \
      --input data/fraud.csv
  displayName: Evaluate fraud model

- task: KubernetesManifest@1
  displayName: Deploy to AKS
  inputs:
    action: deploy
    manifests: |
      k8s/deployment.yaml
      k8s/service.yaml
      k8s/hpa.yaml
      k8s/ingress.yaml