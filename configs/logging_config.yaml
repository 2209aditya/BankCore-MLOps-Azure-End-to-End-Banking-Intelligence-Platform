version: 1

disable_existing_loggers: false

formatters:

  standard:

    format: >
      %(asctime)s
      %(levelname)s
      %(name)s
      %(message)s

handlers:

  console:

    class: logging.StreamHandler
    level: INFO

    formatter: standard

loggers:

  bankcore:

    level: INFO
    handlers:
      - console

root:

  level: INFO
  handlers:
    - console